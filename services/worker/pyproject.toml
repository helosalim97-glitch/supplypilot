[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supplypilot-worker"
version = "0.1.0"
description = "SupplyPilot forecasting worker: supplier lead-time statistics and reorder calculations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
supplypilot-worker = "supplypilot_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/fixtures"]
testpaths = ["tests"]
